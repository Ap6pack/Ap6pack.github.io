name: Normalise honeypot export

# The honeypot instance syncs dist/honeypot/data/ here every ~30 minutes. What
# it publishes is the raw export: no index on logins(ts), no rollups, a manifest
# that types nothing, and a replay carrying the instance's own hostname. Those
# gaps are fixed by scripts that belong in the export pipeline on that machine -
# but until they run there, they run here, over the same files, immediately
# after each sync.
#
# It also builds what the raw export has no notion of: the reconnaissance/attack
# split, and the versioned indicator feed under data/v1/ that third parties
# consume. Those are generated here by design rather than by necessity - both
# are derived entirely from the published export, so the machine producing that
# export is not a better place to compute them.
#
# Everything is idempotent. If the pipeline on the honeypot instance ever starts
# doing this itself, every step reports "nothing to do" and the job commits
# nothing, so there is no need to remove this workflow first.
#
# WHY THIS DOES NOT LOOP
#
# The commit is pushed with GITHUB_TOKEN, and GitHub deliberately does not
# trigger workflows from pushes made with it. The scripts being idempotent is
# the second line of defence, not the first.
#
# WHY IT RETRIES
#
# Two other things push to master: the honeypot's sync cron, every half hour,
# and the dashboard's publish workflow in Ap6pack/sundew. Either can land during
# the twenty seconds this job takes, and then the push is rejected. The first
# version of this workflow failed the run when that happened, which is wrong -
# the answer is to take whatever won, re-normalise on top of it, and push again.
# normalise.sh is written to be re-entrant precisely so that loop is safe.
#
# WHAT IT COSTS
#
# The JSON steps are free. The database step is not: adding the index and the
# rollups appends about 3.4 MB, which lands in a handful of 1 MB shards, and git
# stores SQLite pages more or less uncompressed. It is therefore skipped twice
# over - once when the push did not touch the shards at all, and again when the
# shards are present but already carry a current index and rollups.
#
# The feed is 3.3 MB and every file in it carries a timestamp, so it is written
# only when something other than the clock moved. Three consecutive syncs that
# change no observation rewrite none of its 68 files.

on:
  push:
    branches: [master]
    paths:
      - "dist/honeypot/data/**"
  workflow_dispatch:

permissions:
  contents: write

# Syncs land every half hour; never let two normalisations race for the same
# files. Cancelling in progress is wrong here - a half-written database would be
# committed - so queue instead.
concurrency:
  group: normalise-honeypot-export
  cancel-in-progress: false

jobs:
  normalise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the standard library is used, deliberately: this has to keep
      # working with no dependency resolution and no network.
      - name: Normalise the export
        run: sh .github/scripts/normalise.sh

      # Belt and braces: every script re-run in --check mode must agree there is
      # nothing left to do. A non-zero exit here means the tree we are about to
      # commit is not actually normalised, and publishing it would put confident
      # wrong numbers on the site.
      - name: Verify the tree is fully normalised
        run: |
          set -euo pipefail
          python3 .github/scripts/normalize-samples.py dist/honeypot/data --check
          python3 .github/scripts/redact-replay.py dist/honeypot/data --check
          python3 .github/scripts/shard-db.py join dist/honeypot/data/db "$RUNNER_TEMP/verify.db"
          python3 .github/scripts/index-db.py "$RUNNER_TEMP/verify.db" --check
          python3 .github/scripts/build-rollups.py "$RUNNER_TEMP/verify.db" --check
          python3 .github/scripts/reconcile-stats.py dist/honeypot/data --db "$RUNNER_TEMP/verify.db" --check
          python3 .github/scripts/classify-traffic.py dist/honeypot/data --db "$RUNNER_TEMP/verify.db" --check
          python3 .github/scripts/build-feed.py dist/honeypot/data --db "$RUNNER_TEMP/verify.db" --check
          python3 - "$RUNNER_TEMP/verify.db" <<'PY'
          import sqlite3, sys
          ok = sqlite3.connect(sys.argv[1]).execute("PRAGMA integrity_check").fetchone()[0]
          print(f"integrity_check: {ok}")
          sys.exit(0 if ok == "ok" else 1)
          PY

      - name: Commit and push, re-normalising if the remote moved
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch this run is on, not a hardcoded "master". The push trigger
          # only fires on master, but workflow_dispatch can run this anywhere -
          # and the retry path below resets --hard onto the remote branch. Fixed
          # to master, a rejected push on any other branch would have reset that
          # branch onto master and destroyed the commit it was trying to make.
          BRANCH="${GITHUB_REF_NAME}"
          echo "Working on branch: $BRANCH"

          # `git status --porcelain`, not `git diff`. git diff only reports
          # tracked files, and the feed under dist/honeypot/data/v1/ arrives as
          # new paths - so a sync that changed nothing but the feed would have
          # looked clean here and exited without publishing it.
          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain -- dist/honeypot/data)" ]; then
              echo "Already normalised - nothing to commit."
              exit 0
            fi

            git add -A dist/honeypot/data
            git commit -m "chore: normalise honeypot export

          Applies the export-pipeline scripts to the data the honeypot instance
          just synced: types the sample manifest, redacts the instance's own
          hostname from the replay, separates reconnaissance from attack,
          rebuilds the published feed under data/v1/, and - when the database
          needs it - adds idx_logins_ts and rebuilds the daily_ips and
          hourly_activity rollups.

          Idempotent; this commit is empty when the pipeline has already done it."

            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "::notice::Push rejected on attempt $attempt - something else pushed to $BRANCH. Taking its tree and re-normalising."
            git reset --hard HEAD~1
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            sh .github/scripts/normalise.sh
          done

          echo "::error::Could not push after 3 attempts; master is moving faster than this job can normalise it."
          exit 1
